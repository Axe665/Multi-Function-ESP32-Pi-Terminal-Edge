<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>边节点 · 方向 B · 一个母题</title>
<style>
  :root {
    --ground: #060a09;
    --ink: #eef6f1;
    --dim: #7f918a;
    --line: #14201c;
    --mint: #7be0b0;
    --mint-deep: #10362a;
  }
  @font-face {
    font-family: "Archivo";
    src: url("/fonts/archivo.woff2") format("woff2");
    font-weight: 400 600;
    font-display: swap;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ground); color: var(--ink); }
  body {
    font-family: "Archivo", "Noto Sans SC", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  .wrap { padding: 0 clamp(20px, 5vw, 72px); position: relative; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 26px 0 0; font-size: 13px; color: var(--dim); position: relative; z-index: 3;
  }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--ink); }
  .brand svg { width: 20px; height: 20px; fill: none; stroke: var(--mint); stroke-width: 1.4; stroke-linecap: round; }
  header nav { display: flex; gap: 22px; }
  header nav a { color: var(--dim); text-decoration: none; }
  header nav a:hover { color: var(--ink); }

  /* ---------- 母题：被视口裁掉的大环 ---------- */
  .stage { position: relative; min-height: 92vh; display: flex; align-items: center; }
  .ring-wrap {
    position: absolute; right: -32vw; top: 50%; transform: translateY(-50%);
    width: min(118vh, 1200px); height: min(118vh, 1200px);
    pointer-events: none;
  }
  .ring-wrap svg { width: 100%; height: 100%; overflow: visible; }
  .spin { transform-origin: 50% 50%; animation: spin 120s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  h1 {
    position: relative; z-index: 2; margin: 0;
    font-size: clamp(64px, 13vw, 210px); line-height: 0.86;
    letter-spacing: -0.055em; font-weight: 500;
  }
  h1 em { font-style: normal; color: var(--mint); }
  .sub {
    position: relative; z-index: 2; margin: clamp(20px, 4vh, 44px) 0 0;
    font-size: clamp(17px, 1.6vw, 24px); line-height: 1.5; color: var(--dim); max-width: 24ch;
  }
  .sub b { color: var(--ink); font-weight: 500; }
  .say { position: relative; z-index: 2; margin-top: clamp(28px, 5vh, 52px); display: flex; gap: 14px; }

  .pill {
    display: inline-flex; align-items: center; gap: 9px;
    height: 44px; padding: 0 20px; border-radius: 999px;
    border: 1px solid #24443a; color: var(--ink); text-decoration: none; font-size: 14px;
  }
  .pill.solid { background: var(--mint); border-color: var(--mint); color: #04120d; font-weight: 500; }
  .pill:hover { border-color: var(--mint); }
  .dotpulse { width: 7px; height: 7px; border-radius: 50%; background: var(--mint); animation: pulse 2.4s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

  /* ---------- 三块板子：圆上的弧 ---------- */
  .section { padding: clamp(70px, 12vh, 150px) 0 0; position: relative; z-index: 2; }
  .kicker { font-size: 12px; color: var(--dim); margin-bottom: 26px; letter-spacing: .02em; }
  .devs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .dev {
    border: 1px solid var(--line); border-radius: 22px; padding: 22px;
    background: linear-gradient(180deg, #0a1310 0%, #060a09 100%);
  }
  .dev-top { display: flex; align-items: center; gap: 14px; }
  .gauge { width: 54px; height: 54px; flex: none; }
  .gauge circle { fill: none; stroke-width: 5; }
  .dev h3 { margin: 0; font-size: 16px; font-weight: 500; }
  .dev .id { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .dev .row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 13px; border-top: 1px solid #0f1a16; font-variant-numeric: tabular-nums; }
  .dev .row:first-of-type { margin-top: 16px; }
  .dev .row span { color: var(--dim); }

  /* ---------- 数字：贴在圆上的三个刻度 ---------- */
  .figures { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border-top: 1px solid var(--line); margin-top: 60px; }
  .figures div { padding: 26px 0 30px 24px; border-left: 1px solid var(--line); }
  .figures div:first-child { border-left: 0; padding-left: 0; }
  .figures small { display: block; font-size: 12px; color: var(--dim); margin-bottom: 8px; }
  .figures b { font-size: clamp(34px, 4vw, 54px); font-weight: 400; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .figures u { text-decoration: none; color: var(--dim); font-size: 14px; margin-left: 6px; }

  /* ---------- 建议：沿弧线排 ---------- */
  .advice { margin-top: 22px; }
  .advice a {
    display: grid; grid-template-columns: 46px 1fr auto; gap: 18px; align-items: center;
    padding: 18px 20px; border: 1px solid var(--line); border-radius: 999px;
    margin-bottom: 10px; color: inherit; text-decoration: none; transition: border-color .2s, background .2s;
  }
  .advice a:hover { border-color: #2b5446; background: #081210; }
  .advice .mark { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center;
    background: var(--mint-deep); color: var(--mint); font-size: 12px; }
  .advice p { margin: 0; font-size: clamp(15px, 1.3vw, 18px); }
  .advice time { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }

  .close { padding: clamp(80px, 14vh, 170px) 0 40px; }
  .close p { margin: 0; font-size: clamp(30px, 4.6vw, 68px); line-height: 1; letter-spacing: -0.04em; max-width: 16ch; }
  .close p em { font-style: normal; color: var(--mint); }
  footer { display: flex; justify-content: space-between; padding: 26px 0 40px; font-size: 12px; color: var(--dim); border-top: 1px solid var(--line); }

  @media (max-width: 900px) {
    .devs, .figures { grid-template-columns: 1fr; }
    .figures div { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); }
    .ring-wrap { right: -70vw; opacity: .55; }
  }
  @media (prefers-reduced-motion: reduce) { .spin, .dotpulse { animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <svg viewBox="0 0 20 20"><path d="M4 3v14M4 6h7M4 13h7M11 6v7"/><circle cx="16" cy="6" r="1.6"/><circle cx="16" cy="13" r="1.6"/></svg>
      Modular Terminal
    </div>
    <nav><a href="#devs">设备</a><a href="#advice">建议</a><a href="#mass">边界</a></nav>
  </header>

  <section class="stage">
    <div class="ring-wrap">
      <svg viewBox="0 0 400 400" aria-hidden="true">
        <g class="spin">
          <circle cx="200" cy="200" r="188" fill="none" stroke="#14201c" stroke-width="1"/>
          <circle cx="200" cy="200" r="150" fill="none" stroke="#1b2b25" stroke-width="1"/>
          <!-- 刻度环 -->
          <g id="ticks"></g>
        </g>
        <circle cx="200" cy="200" r="118" fill="none" stroke="#24443a" stroke-width="1" stroke-dasharray="2 6"/>
        <g id="arcs"></g>
        <circle cx="200" cy="200" r="64" fill="#07100d" stroke="#2b5446" stroke-width="1"/>
        <text x="200" y="196" text-anchor="middle" fill="#7be0b0" font-size="26" font-family="Archivo, sans-serif" letter-spacing="-1">k≥5</text>
        <text x="200" y="216" text-anchor="middle" fill="#7f918a" font-size="9" font-family="Archivo, sans-serif">门槛</text>
      </svg>
    </div>

    <div>
      <h1>k ≥ 5<br><em>是闸门</em></h1>
      <p class="sub">低于五个人的桶，<b>到不了这台机器</b>。边上看到的每一条线，背后至少有五个人。</p>
      <div class="say">
        <a class="pill solid" href="#devs"><span class="dotpulse"></span>看三块板子</a>
        <a class="pill" href="#advice">今天的建议</a>
      </div>
    </div>
  </section>

  <section class="section" id="devs">
    <p class="kicker">此刻挂在环上的三块板子 · 弧长 = 24 小时到达率</p>
    <div class="devs" id="devs"></div>
    <div class="figures" id="figures">
      <div><small>24 小时批次</small><b>—</b></div>
      <div><small>被拦下的桶</small><b>—</b></div>
      <div><small>生成的建议</small><b>—</b></div>
    </div>
  </section>

  <section class="section" id="advice">
    <p class="kicker">最近三条</p>
    <div class="advice" id="advice"></div>
  </section>

  <section class="close" id="mass">
    <p>环之所以是环，是因为<em>少一个人就断</em>。</p>
    <footer><span>edge-lab-01 · k≥5</span><span>原始数据不出端</span></footer>
  </section>
</div>

<script>
const fmt = (n, d = 0) => Number(n).toLocaleString("zh-CN", { minimumFractionDigits: d, maximumFractionDigits: d });
const NS = "http://www.w3.org/2000/svg";
const el = (t, a = {}) => { const n = document.createElementNS(NS, t); for (const [k, v] of Object.entries(a)) n.setAttribute(k, v); return n; };

/* 刻度环 */
(() => {
  const g = document.getElementById("ticks");
  for (let i = 0; i < 180; i++) {
    const a = (i / 180) * Math.PI * 2;
    const long = i % 15 === 0;
    const r1 = 176, r2 = long ? 166 : 171;
    g.append(el("line", {
      x1: 200 + Math.cos(a) * r1, y1: 200 + Math.sin(a) * r1,
      x2: 200 + Math.cos(a) * r2, y2: 200 + Math.sin(a) * r2,
      stroke: long ? "#3a6b57" : "#1b2b25", "stroke-width": long ? 1.2 : 0.8,
    }));
  }
})();

function arc(cx, cy, r, from, to) {
  const a0 = (from - 90) * Math.PI / 180, a1 = (to - 90) * Math.PI / 180;
  const large = to - from > 180 ? 1 : 0;
  return `M ${cx + Math.cos(a0) * r} ${cy + Math.sin(a0) * r} A ${r} ${r} 0 ${large} 1 ${cx + Math.cos(a1) * r} ${cy + Math.sin(a1) * r}`;
}

fetch("/api/v1/overview").then((r) => r.json()).then((o) => {
  const arcs = document.getElementById("arcs");
  const span = 84 / Math.max(1, o.lanes.length);
  o.lanes.forEach((l, i) => {
    const from = -42 + i * span + 3;
    const to = from + (span - 6) * (l.fill / 100);
    arcs.append(el("path", {
      d: arc(200, 200, 118, from, to), fill: "none",
      stroke: l.online ? "#7be0b0" : "#2b5446", "stroke-width": 7, "stroke-linecap": "round",
    }));
    // 起点标签
    const a = (from - 90) * Math.PI / 180;
    const tx = 200 + Math.cos(a) * 140, ty = 200 + Math.sin(a) * 140;
    const t = el("text", { x: tx, y: ty, fill: "#eef6f1", "font-size": 8.5, "font-family": "Archivo, sans-serif", "text-anchor": "middle" });
    t.textContent = `${l.modules.join("/")} · k${l.k}`;
    arcs.append(t);
  });

  document.getElementById("devs").innerHTML = o.lanes.map((l) => {
    const c = 2 * Math.PI * 22;
    return `
    <article class="dev">
      <div class="dev-top">
        <svg class="gauge" viewBox="0 0 54 54">
          <circle cx="27" cy="27" r="22" stroke="#132019"/>
          <circle cx="27" cy="27" r="22" stroke="${l.online ? "#7be0b0" : "#2b5446"}"
            stroke-dasharray="${(c * l.fill / 100).toFixed(1)} ${c}"
            stroke-linecap="round" transform="rotate(-90 27 27)"/>
          <text x="27" y="31" text-anchor="middle" fill="#eef6f1" font-size="11"
            font-family="Archivo, sans-serif">${l.fill}%</text>
        </svg>
        <div>
          <h3>${l.name.split("·")[0].trim()}</h3>
          <div class="id">${l.device_id} · ${l.scene}</div>
        </div>
      </div>
      ${l.metrics.map((m) => `<div class="row"><span>${m.label}</span><b>${fmt(m.mean, m.decimals)} ${m.unit}</b></div>`).join("")}
    </article>`;
  }).join("");

  const f = document.querySelectorAll("#figures b");
  f[0].innerHTML = fmt(o.batches_24h) + '<u>批</u>';
  f[1].innerHTML = fmt(o.suppressed_buckets) + '<u>个</u>';
  f[2].innerHTML = fmt(o.advice_24h) + '<u>条</u>';

  fetch("/api/v1/advice?limit=3").then((r) => r.json()).then((rows) => {
    document.getElementById("advice").innerHTML = rows.map((a) => `
      <a href="#">
        <span class="mark">${a.risk === "alert" ? "!" : a.risk === "watch" ? "○" : "·"}</span>
        <p>${a.text}</p>
        <time>${new Date(a.created_at).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" })}</time>
      </a>`).join("");
  });
});
</script>
</body>
</html>
