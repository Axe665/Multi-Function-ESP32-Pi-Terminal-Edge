<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>边节点 · 方向 C · 纯字排</title>
<style>
  :root {
    --paper: #f1efe9;
    --ink: #111310;
    --dim: #6d6f69;
    --hair: #cfccc3;
    --hot: #b23a20;
  }
  @font-face {
    font-family: "Archivo";
    src: url("/fonts/archivo.woff2") format("woff2");
    font-weight: 400 600;
    font-display: swap;
  }
  @font-face {
    font-family: "JetBrains Mono";
    src: url("/fonts/jetbrains.woff2") format("woff2");
    font-weight: 400 500;
    font-display: swap;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body {
    font-family: "Archivo", "Noto Sans SC", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { padding: 0 clamp(20px, 5vw, 76px); }

  header {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 24px 0 18px; border-bottom: 1px solid var(--ink);
    font-size: 12px; font-family: "JetBrains Mono", monospace; letter-spacing: .04em;
  }
  .brand { font-family: "Archivo", sans-serif; font-weight: 600; font-size: 14px; letter-spacing: -0.01em; }
  header nav { display: flex; gap: 20px; }
  header nav a { color: var(--dim); text-decoration: none; }
  header nav a:hover { color: var(--ink); }

  /* ---------- 第一屏：只有字 ---------- */
  .hero { padding: clamp(40px, 8vh, 104px) 0 clamp(30px, 5vh, 60px); }
  .meta { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--dim); letter-spacing: .06em; margin-bottom: 26px; }
  h1 { margin: 0; font-size: clamp(40px, 8.6vw, 150px); line-height: 0.88; letter-spacing: -0.05em; font-weight: 400; }
  h1 .n { font-weight: 600; }
  h1 .u { font-size: .38em; letter-spacing: 0; color: var(--dim); margin-left: .12em; font-weight: 400; }
  h1 .row { display: block; }
  h1 .gap { display: block; height: .22em; }
  h1 .hot { color: var(--hot); }

  .lede {
    margin: clamp(26px, 4vh, 46px) 0 0; max-width: 46ch;
    font-size: clamp(15px, 1.25vw, 18px); line-height: 1.65; color: #2a2c28;
  }
  .lede b { font-weight: 600; }

  /* ---------- 规格表 ---------- */
  .sheet { border-top: 6px solid var(--ink); margin-top: clamp(40px, 7vh, 80px); }
  .sheet-head {
    display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr; gap: 16px;
    padding: 10px 0; border-bottom: 1px solid var(--ink);
    font-family: "JetBrains Mono", monospace; font-size: 10.5px; letter-spacing: .06em; color: var(--dim);
  }
  .row {
    display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr; gap: 16px;
    align-items: baseline; padding: 16px 0; border-bottom: 1px solid var(--hair);
    font-variant-numeric: tabular-nums;
  }
  .row .who { font-size: 15px; font-weight: 500; }
  .row .who small { display: block; font-family: "JetBrains Mono", monospace; font-size: 10.5px; color: var(--dim); font-weight: 400; margin-top: 3px; letter-spacing: .04em; }
  .row .num { text-align: right; font-size: 20px; }
  .row .num small { font-size: 11px; color: var(--dim); margin-left: 3px; }
  .row .pct { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--dim); text-align: right; }

  /* ---------- 指标长表 ---------- */
  .metrics { margin-top: clamp(50px, 9vh, 110px); }
  .metrics h2 { font-size: 13px; font-weight: 500; margin: 0 0 4px; letter-spacing: 0; }
  .metrics p { margin: 0 0 14px; font-family: "JetBrains Mono", monospace; font-size: 10.5px; color: var(--dim); letter-spacing: .05em; }
  .m-row {
    display: grid; grid-template-columns: 3fr 1.4fr 1fr 1fr; gap: 16px;
    padding: 9px 0; border-bottom: 1px solid var(--hair); font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  .m-row span:nth-child(2) { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--dim); }
  .m-row b { text-align: right; font-weight: 500; }
  .m-row i { text-align: right; font-style: normal; font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--dim); }

  /* ---------- 建议：竖排编号 ---------- */
  .notes { margin-top: clamp(50px, 9vh, 110px); border-top: 1px solid var(--ink); }
  .note {
    display: grid; grid-template-columns: 60px 1fr auto; gap: 20px; align-items: start;
    padding: 20px 0; border-bottom: 1px solid var(--hair);
  }
  .note .idx { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--dim); padding-top: 4px; }
  .note p { margin: 0; font-size: clamp(16px, 1.5vw, 20px); line-height: 1.5; letter-spacing: -0.01em; }
  .note .tag { font-family: "JetBrains Mono", monospace; font-size: 10.5px; letter-spacing: .06em; padding-top: 5px; }
  .note .tag.watch { color: #8a6413; }
  .note .tag.alert { color: var(--hot); }
  .note .tag.info { color: var(--dim); }

  .close { margin: clamp(70px, 12vh, 150px) 0 0; padding: 28px 0 40px; border-top: 6px solid var(--ink); }
  .close p { margin: 0; font-size: clamp(26px, 3.8vw, 58px); line-height: 1.06; letter-spacing: -0.04em; max-width: 20ch; }
  .close p em { font-style: normal; color: var(--hot); }
  footer { display: flex; justify-content: space-between; padding: 20px 0 40px;
    font-family: "JetBrains Mono", monospace; font-size: 10.5px; color: var(--dim); letter-spacing: .05em; }

  @media (max-width: 820px) {
    .sheet-head, .row, .m-row { grid-template-columns: 2fr 1fr 1fr; }
    .sheet-head span:nth-child(n+4), .row > *:nth-child(n+4), .m-row > *:nth-child(2) { display: none; }
    .note { grid-template-columns: 40px 1fr; }
    .note .tag { grid-column: 2; padding-top: 6px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <span class="brand">Modular Terminal / 边节点</span>
    <nav><a href="#sheet">设备</a><a href="#metrics">指标</a><a href="#notes">建议</a></nav>
  </header>

  <section class="hero">
    <p class="meta">EDGE-LAB-01 · 5 分钟窗口 · K≥5 · <span id="stamp">—</span></p>
    <h1>
      <span class="row"><span class="n" id="n-dev">3</span><span class="u">台板子</span></span>
      <span class="row"><span class="n" id="n-batch">—</span><span class="u">批数据</span></span>
      <span class="row"><span class="n hot" id="n-drop">—</span><span class="u">个桶被拦下</span></span>
    </h1>
    <p class="lede">
      这一页没有图。数字本身就是图：谁在报、报了多少、多少因为<b>凑不满五个人</b>被丢在了端上。
    </p>
  </section>

  <section class="sheet" id="sheet">
    <div class="sheet-head">
      <span>设备 / 模块</span><span style="text-align:right">到达率</span>
      <span style="text-align:right">最小 k</span><span style="text-align:right">指标</span><span style="text-align:right">最后上报</span>
    </div>
    <div id="rows"></div>
  </section>

  <section class="metrics" id="metrics">
    <h2>最新聚合</h2>
    <p>每台设备 · 每 5 分钟 · 只保留 mean / slope / z / n / k</p>
    <div id="metric-rows"></div>
  </section>

  <section class="notes" id="notes">
    <div class="note"><span class="idx">—</span><p>读取中…</p><span class="tag"></span></div>
  </section>

  <section class="close">
    <p>没有五个人，就<em>没有这一行</em>。</p>
    <footer><span>EDGE-LAB-01 · 实验边节点</span><span>原始数据不出端</span></footer>
  </section>
</div>

<script>
const fmt = (n, d = 0) => Number(n).toLocaleString("zh-CN", { minimumFractionDigits: d, maximumFractionDigits: d });
const pad = (n) => String(n).padStart(2, "0");
const hhmm = (ts) => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };

fetch("/api/v1/overview").then((r) => r.json()).then((o) => {
  document.getElementById("n-dev").textContent = o.devices_online;
  document.getElementById("n-batch").textContent = fmt(o.batches_24h);
  document.getElementById("n-drop").textContent = fmt(o.suppressed_buckets);
  document.getElementById("stamp").textContent = hhmm(o.generated_at);

  document.getElementById("rows").innerHTML = o.lanes.map((l) => `
    <div class="row">
      <div class="who">${l.name.split("·")[0].trim()}
        <small>${l.device_id} · 模块 ${l.modules.join("/")} · ${l.scene}</small></div>
      <div class="num">${l.fill}<small>%</small></div>
      <div class="num">${l.k}</div>
      <div class="num">${l.metrics.length}</div>
      <div class="pct">${l.last_seen ? hhmm(l.last_seen) : "—"}</div>
    </div>`).join("");

  const rows = o.lanes.flatMap((l) => l.metrics.map((m) => ({ dev: l.device_id, ...m })));
  document.getElementById("metric-rows").innerHTML = rows.map((m) => `
    <div class="m-row">
      <span>${m.label}</span>
      <span>${m.dev}</span>
      <b>${fmt(m.mean, m.decimals)} ${m.unit}</b>
      <i>k=${m.k} · ${m.z >= 0 ? "+" : ""}${m.z.toFixed(1)}σ</i>
    </div>`).join("");

  fetch("/api/v1/advice?limit=4").then((r) => r.json()).then((rows2) => {
    document.getElementById("notes").innerHTML = rows2.map((a, i) => `
      <div class="note">
        <span class="idx">${pad(i + 1)}</span>
        <p>${a.text}</p>
        <span class="tag ${a.risk}">${a.risk === "alert" ? "ALERT" : a.risk === "watch" ? "WATCH" : "INFO"} · ${hhmm(a.created_at)}</span>
      </div>`).join("");
  });
});
</script>
</body>
</html>
