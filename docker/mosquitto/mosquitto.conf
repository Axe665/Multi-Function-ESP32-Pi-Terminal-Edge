# 端 → 边 的 MQTT over TLS 1.3，双向证书。
# 证书由边 CA 签发：python3 scripts/make_broker_cert.py mqtt.edge.local
per_listener_settings false

listener 8883
allow_anonymous false
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/broker.crt
keyfile  /mosquitto/certs/broker.key
require_certificate true
use_identity_as_username true
tls_version tlsv1.3

# 内网管理口（文档 §5.1）：同一套 mTLS，只绑宿主 loopback，不对外
listener 8884

# 每台设备只能读写自己的前缀
acl_file /mosquitto/config/acl

# 吊销列表：边在 /devices/{id}/revoke 时重写，broker 重载后断连
crlfile /mosquitto/certs/crl.pem
