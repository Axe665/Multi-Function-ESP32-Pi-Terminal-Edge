services:
  edge:
    build: ..
    image: modular-terminal-edge:1.0.0
    container_name: mt-edge
    restart: unless-stopped
    ports:
      # 只绑本机：管理台不对外，需要外网访问时在前面加一层 Caddy + mTLS
      - "127.0.0.1:8001:8001"
    volumes:
      - ../data:/app/data
    environment:
      EDGE_ID: ${EDGE_ID:-edge-lab-01}
      EDGE_NAME: ${EDGE_NAME:-实验室边节点}
      # 端 → 边 走 MQTT；配了主机就连 broker，连不上不影响 HTTPS 摄取
      EDGE_MQTT_HOST: ${EDGE_MQTT_HOST:-mosquitto}
      EDGE_MQTT_PORT: ${EDGE_MQTT_PORT:-8883}
      EDGE_MQTT_CA: /app/certs/ca.crt
      EDGE_MQTT_CERT: /app/certs/edge.crt
      EDGE_MQTT_KEY: /app/certs/edge.key
      EDGE_CLOUD_URL: ${EDGE_CLOUD_URL:-}
      EDGE_CLOUD_TOKEN: ${EDGE_CLOUD_TOKEN:-}
      EDGE_INGEST_TOKEN: ${EDGE_INGEST_TOKEN:-}
      EDGE_ADMIN_TOKEN: ${EDGE_ADMIN_TOKEN:-}
      EDGE_K_MIN: ${EDGE_K_MIN:-5}
      TZ: Asia/Shanghai
    # cgroup 限额：边只做聚合和查询，给 1G 足够
    deploy:
      resources:
        limits:
          memory: 1g

  # 主通道 broker。证书用 scripts/make_broker_cert.py 签，见 mosquitto/mosquitto.conf
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mt-mqtt
    restart: unless-stopped
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto:/mosquitto/config:ro
      - ../data/mqtt:/mosquitto/data
    deploy:
      resources:
        limits:
          memory: 256m
