name: modular-terminal-edge

# 边节点：mosquitto + ingest + api + web（文档 §5.1 的四服务）
# 数据落 ./data（SQLite WAL，文档要求边保持 SQLite，不换 PG）
x-edge: &edge
  image: modular-terminal-edge:2.0.0
  restart: unless-stopped
  depends_on:
    mosquitto:
      condition: service_started
  volumes:
    - edge_data:/app/data
    - ./mosquitto/certs:/app/certs
    - ./cloud-certs:/app/cloud-certs:ro
  networks:
    - default
    # 云的默认网络，用来解析 caddy:8443
    - backbone
  environment: &edge-env
    EDGE_ID: ${EDGE_ID:-edge-lab-01}
    EDGE_NAME: ${EDGE_NAME:-实验室边节点}
    EDGE_MQTT_HOST: ${EDGE_MQTT_HOST:-mosquitto}
    EDGE_MQTT_PORT: ${EDGE_MQTT_PORT:-8883}
    EDGE_MQTT_CA: /app/certs/ca.crt
    EDGE_MQTT_CERT: /app/certs/edge.crt
    EDGE_MQTT_KEY: /app/certs/edge.key
    # 云侧 mTLS 入口（文档 §5.8）：证书由 cloud-ca 签发
    EDGE_CLOUD_URL: ${EDGE_CLOUD_URL:-https://caddy:8443}
    EDGE_CLOUD_CA: /app/cloud-certs/cloud-ca.crt
    EDGE_CLOUD_CERT: /app/cloud-certs/edge.crt
    EDGE_CLOUD_KEY: /app/cloud-certs/edge.key
    EDGE_CLOUD_TOKEN: ${EDGE_CLOUD_TOKEN:-}
    EDGE_INGEST_TOKEN: ${EDGE_INGEST_TOKEN:-}
    EDGE_ADMIN_TOKEN: ${EDGE_ADMIN_TOKEN:-}
    EDGE_K_MIN: ${EDGE_K_MIN:-5}
    EDGE_SIM: ${EDGE_SIM:-1}
    EDGE_AUTOSEED: "1"
    EDGE_DEMO: ${EDGE_DEMO:-1}
    EDGE_BUILD: ${EDGE_BUILD:-compose-dev}
    TZ: Asia/Shanghai

services:
  # 主通道 broker：8883 mTLS 给设备，8884 只给内网管理
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mt-mqtt
    restart: unless-stopped
    ports:
      - "8883:8883"
      # 8884（内网管理）暂未启用：管理面走 HTTP，不需要第二个 listener
    volumes:
      - ./mosquitto:/mosquitto/config:ro
      - ./mosquitto/certs:/mosquitto/certs
      - mqtt_data:/mosquitto/data
    deploy:
      resources:
        limits:
          memory: 256m

  # 写入口：MQTT 订阅 + HTTP 摄取 + 演示补数 + 定时上云 + mDNS
  ingest:
    <<: *edge
    # 只在 ingest 上构建一次，api 复用同一镜像（并行构建会撞标签）
    build:
      context: ..
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.11-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: mt-edge-ingest
    command: ["python", "-m", "uvicorn", "edge.ingest_main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8885:8001"   # 只需给本机的 mosquitto 之外的调试用，正式流量走 web
    deploy:
      resources:
        limits:
          memory: 768m

  # 查询与管理：不连 MQTT，不跑定时任务
  api:
    <<: *edge
    container_name: mt-edge-api
    depends_on:
      ingest:
        condition: service_started
    command: ["python", "-m", "uvicorn", "edge.api_main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      <<: *edge-env
      EDGE_SIM: "0"
    deploy:
      resources:
        limits:
          memory: 768m

  # 静态前端 + 反代（文档 §5.1 的 web）
  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: modular-terminal-edge-web:2.0.0
    container_name: mt-edge-web
    restart: unless-stopped
    ports:
      # 管理台不对外，需要外网时在前面加隧道或 VPN
      - "127.0.0.1:8001:8001"
    volumes:
      - caddy_data:/data
    depends_on:
      - ingest
      - api
    deploy:
      resources:
        limits:
          memory: 128m

volumes:
  edge_data:
  mqtt_data:
  caddy_data:

networks:
  # 云仓的默认网络；先起云再起边
  backbone:
    external: true
    name: mt-backbone
