name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t . -v
      - run: python scripts/sync_contracts.py --check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r requirements.txt
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      # 演示数据 + 真 API：smoke 断言的是页面有数据，不是空壳
      - name: smoke
        env:
          EDGE_DB: /tmp/edge-ci.db
          EDGE_DATA_DIR: /tmp/edge-ci
          EDGE_API: http://127.0.0.1:8001
          EDGE_MDNS: "0"
        run: |
          python -m edge.seed
          python -m edge.api_main > /tmp/api.log 2>&1 &
          (cd web && npx vite preview --port 4173 --host 127.0.0.1 > /tmp/preview.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/api/v1/health && break
            sleep 2
          done
          (cd web && node tests/smoke.mjs http://127.0.0.1:4173)
          cat /tmp/api.log
